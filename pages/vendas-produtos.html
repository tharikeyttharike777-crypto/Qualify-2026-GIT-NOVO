  <script>
    (function () {
      function fmt(d) { try { const p = String(d || '').split('-'); if (p.length === 3) return `${p[2]}/${p[1]}/${p[0]}`; } catch (_) { } return d || ''; }
      var start = document.getElementById('startDate');
      var end = document.getElementById('endDate');
      var status = document.getElementById('statusText');
      var confirmBtn = document.getElementById('confirmDatesBtn');
      var pdfBtn = document.getElementById('emitPdfBtn');
      function validate() {
        var s = start.value, e = end.value;
        if (!s || !e) { status.textContent = 'Selecione as duas datas.'; return false; }
        if (new Date(s) > new Date(e)) { status.textContent = 'A data inicial deve ser anterior Ã  final.'; return false; }
        status.textContent = `PerÃ­odo selecionado: ${fmt(s)} a ${fmt(e)}.`; return true;
      }
      confirmBtn.addEventListener('click', function () { validate(); });
      pdfBtn.addEventListener('click', function () { if (validate()) { window.print(); } });
    })();
  </script>
