<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Chargebacks - Gestão Financeira</title>
    <link rel="stylesheet" href="../assets/css/styles.css?v=20250127003">
    <link rel="stylesheet" href="../assets/css/sidebar-menu.css?v=20250127003">
    <link rel="stylesheet" href="../assets/css/user-menu.css?v=20250127003">
    <link rel="stylesheet" href="../assets/css/sidebar-fix.css?v=20250127003">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css?v=20250127003" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css?v=20250127003" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f7fb; min-height: 100vh; }
        .placeholder-container { background: white; border-radius: 12px; box-shadow: 0 6px 16px rgba(0,0,0,.08); padding: 2rem; max-width: 900px; margin: 2rem auto; }
        .placeholder-icon { font-size: 3rem; color: #764ba2; margin-bottom: 1rem; }
        .btn-back { background: #764ba2; border: none; border-radius: 8px; padding: .6rem 1.6rem; color: white; }
    </style>
    <script src="../assets/js/utils/header-search.js?v=20250127003" defer></script>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <button class="hamburger-menu" id="menu-toggle" aria-label="Abrir menu"><i class="fas fa-bars"></i></button>
            <div class="logo"><img src="../assets/images/qualify-logo.svg" alt="Qualify Logo" width="24" height="24" style="margin-right:8px;"><span class="logo-text">QUALIFY - Sistema de gestão</span></div>
        </div>
        <div class="header-center">
            <div class="search-container"><input type="text" class="search-input" placeholder="Pesquisar páginas..." id="page-search"><i class="fas fa-search search-icon"></i><div id="search-results" class="search-results"></div></div>
        </div>
        <div class="header-right">
            <div class="user-info"></div>
            <div class="user-menu-container"><button class="user-menu-trigger" id="userMenuTrigger" aria-label="Menu do Usuário" aria-expanded="false"><i class="fas fa-user-circle"></i></button><div class="user-dropdown" id="userDropdown" role="menu"><div class="dropdown-content"></div></div></div>
        </div>
    </header>
    <nav id="sidebar" class="sidebar">
        <div class="sidebar-header"><h3>Menu</h3><button id="sidebar-close" class="sidebar-close">&times;</button></div>
        <div class="sidebar-content">
            <ul class="sidebar-menu">
                <li class="menu-item"><a href="../index.html" class="menu-link"><span class="menu-text">Início</span></a></li>
                <li class="menu-item"><a href="transferencia.html" class="menu-link"><span class="menu-text">Transferência</span></a></li>
                <li class="menu-item"><a href="extrato.html" class="menu-link"><span class="menu-text">Extrato</span></a></li>
            </ul>
        </div>
    </nav>
    <div id="sidebar-overlay" class="sidebar-overlay"></div>
    <main class="main-content">
        <div class="placeholder-container">
            <i class="fas fa-credit-card placeholder-icon"></i>
            <h1 class="mb-3">Chargebacks</h1>
            <p class="mb-3">Em breve você poderá visualizar e tratar chargebacks diretamente nesta página.</p>
            <button class="btn btn-back" onclick="history.back()"><i class="fas fa-arrow-left me-2"></i>Voltar</button>
        </div>
    </main>
    <script src="../assets/js/core/sidebar-menu.js?v=20250127003" defer></script>
    <script>
    function initializeImprovedAccordion(){setTimeout(function(){var i=document.querySelectorAll('.menu-item.has-submenu');i.forEach(function(n){var l=n.querySelector('.menu-link'),s=n.querySelector('.submenu');if(l&&s){var nl=l.cloneNode(true);l.parentNode.replaceChild(nl,l);nl.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();i.forEach(function(o){if(o!==n){o.classList.remove('expanded');var os=o.querySelector('.submenu');if(os){os.style.display='none';}}});var ex=n.classList.contains('expanded');if(ex){n.classList.remove('expanded');s.style.display='none';}else{n.classList.add('expanded');s.style.display='block';}});}});},100);}if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',initializeImprovedAccordion);}else{initializeImprovedAccordion();}
    </script>
    <script src="../assets/js/core/user-menu.js?v=20250127003" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js?v=20250127003" defer></script>
</body>
</html>
