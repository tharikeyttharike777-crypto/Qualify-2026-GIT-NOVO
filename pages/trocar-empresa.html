<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trocar Empresa - QUALIFY 2.0</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="../assets/css/header.css">
    <link rel="stylesheet" href="../assets/css/trocar-empresa.css">
</head>

<body>
    <!-- Cabeçalho -->
    <header class="header">
        <div class="header-left">
            <button id="voltarBtn" class="btn-voltar">← Voltar</button>
        </div>
        <div class="header-center">
            <h1>Trocar Empresa</h1>
        </div>
        <div class="header-right">
            <span id="userEmail" class="user-email">Carregando...</span>
        </div>
    </header>

    <!-- Corpo Principal -->
    <main class="main-content">
        <div class="content-area">
            <!-- Botão Nova Empresa -->
            <div class="nova-empresa-section">
                <button id="novaEmpresaBtn" class="btn-nova-empresa">+ Nova Empresa</button>
            </div>

            <!-- Loading -->
            <div id="loading" class="loading-container">
                <div class="loading-spinner"></div>
                <p>Carregando empresas...</p>
            </div>

            <!-- Área de Empresas Existentes -->
            <div class="empresas-section">
                <h2>Empresas Existentes</h2>
                <div id="empresasGrid" class="empresas-grid">
                    <!-- Empresas serão carregadas aqui -->
                </div>
                <div id="nenhumaEmpresa" class="nenhuma-empresa" style="display: none;">
                    <p>Nenhuma empresa encontrada. Crie sua primeira empresa!</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Nova Empresa -->
    <div id="modal-nova-empresa" class="modal-overlay" style="display: none;">
        <div class="modal-container">
            <div class="modal-header">
                <h3>Nova Empresa</h3>
                <button type="button" id="btn-fechar-modal" class="btn-fechar-modal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="form-nova-empresa">
                    <div class="form-group">
                        <label for="input-nome-empresa">Nome da Empresa *</label>
                        <input type="text" id="input-nome-empresa" name="nome" required
                            placeholder="Digite o nome da empresa">
                    </div>
                    <div class="form-group">
                        <label for="input-cnpj">CNPJ *</label>
                        <input type="text" id="input-cnpj" name="cnpj" required placeholder="00.000.000/0000-00">
                    </div>
                    <div class="form-group">
                        <label for="input-cidade">Cidade *</label>
                        <input type="text" id="input-cidade" name="cidade" required placeholder="Digite a cidade">
                    </div>
                    <div class="modal-actions">
                        <button type="button" id="btn-cancelar-modal" class="btn-cancelar">Cancelar</button>
                        <button type="submit" id="btn-salvar-empresa" class="btn-salvar">Salvar Empresa</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Conflict Prevention Flag -->
    <script>
        // Impeça que scripts globais (auth-guard, multitenant-config) desenhem a tela
        // pois esta página tem seu próprio script controlador (trocar-empresa.js)
        window.DISABLE_MULTITENANT_AUTO_RENDER = true;
        console.log('🛑 Auto-renderização global DESATIVADA para esta página.');
    </script>

    <!-- Scripts do Firebase: carregue compat libs ANTES do firebase-config -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
    <script src="../firebase-config.js"></script>

    <script src="../assets/js/auth-guard.js"></script>

    <script src="../assets/js/multitenant-config.js"></script>

    <script src="../assets/js/trocar-empresa.js"></script>
    <script src="../assets/js/user-menu.js"></script>
</body>

</html>
